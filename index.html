<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, #e5ecff 0, transparent 32rem),
        radial-gradient(circle at 90% 90%, #e8f5f0 0, transparent 28rem),
        #f4f6fb;
    }

    main { width: min(100%, 380px); }

    .eyebrow {
      margin: 0 0 12px;
      color: #6b7891;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .calculator {
      overflow: hidden;
      border: 1px solid #e7eaf1;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px #28375d1c;
    }

    .display {
      min-height: 142px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
      background: linear-gradient(145deg, #fff, #f8f9fd);
      text-align: right;
    }

    .expression {
      min-height: 22px;
      overflow: hidden;
      color: #8791a5;
      font-size: 0.9rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    output {
      overflow: hidden;
      color: #172033;
      font-size: clamp(2.5rem, 12vw, 3.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      letter-spacing: -0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      min-height: 20px;
      padding: 0 24px 14px;
      color: #bb3d4a;
      font-size: 0.8rem;
      text-align: right;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 18px 20px;
    }

    button {
      min-height: 64px;
      border: 0;
      border-radius: 16px;
      background: #f1f3f8;
      color: #263149;
      cursor: pointer;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 600;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover { background: #e8ebf3; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 3px solid #8297f8; outline-offset: 2px; }

    .utility { color: #586681; background: #e9edf6; }
    .operator { color: #445bd5; background: #edf0ff; }
    .equals { color: #fff; background: #5268e8; }
    .equals:hover { background: #4057d4; }
    .zero { grid-column: span 2; }

    .service-note {
      margin: 14px 0 0;
      color: #8490a5;
      font-size: 0.75rem;
      text-align: center;
    }

    @media (max-width: 420px) {
      body { padding: 14px; }
      button { min-height: 58px; }
      .keys { gap: 8px; padding: 0 14px 16px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Everyday calculations</p>
    <section class="calculator" aria-label="Calculator">
      <div class="display">
        <div class="expression" id="expression" aria-hidden="true"></div>
        <output id="display" aria-live="polite">0</output>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="keys">
        <button class="utility" data-action="clear" aria-label="Clear">AC</button>
        <button class="utility" data-action="sign" aria-label="Change sign">+/-</button>
        <button class="utility" data-action="backspace" aria-label="Delete last digit">DEL</button>
        <button class="operator" data-operation="divide" aria-label="Divide">÷</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button class="operator" data-operation="multiply" aria-label="Multiply">×</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button class="operator" data-operation="subtract" aria-label="Subtract">−</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button class="operator" data-operation="add" aria-label="Add">+</button>

        <button class="zero" data-digit="0">0</button>
        <button data-action="decimal" aria-label="Decimal point">.</button>
        <button class="equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>
    <p class="service-note">Calculations are handled by the JSON API.</p>
  </main>

  <script>
    const display = document.getElementById("display");
    const expression = document.getElementById("expression");
    const status = document.getElementById("status");
    let firstOperand = null;
    let pendingOperation = null;
    let waitingForOperand = false;

    function clearStatus() {
      status.textContent = "";
    }

    function enterDigit(digit) {
      clearStatus();
      if (waitingForOperand) {
        display.textContent = digit;
        waitingForOperand = false;
      } else if (display.textContent === "0") {
        display.textContent = digit;
      } else {
        display.textContent += digit;
      }
    }

    function enterDecimal() {
      clearStatus();
      if (waitingForOperand) {
        display.textContent = "0.";
        waitingForOperand = false;
      } else if (!display.textContent.includes(".")) {
        display.textContent += ".";
      }
    }

    async function requestCalculation(left, operation, right) {
      const response = await fetch("/calculate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ left, operation, right })
      });
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.detail || "The calculation could not be completed.");
      }
      return result.result;
    }

    async function chooseOperation(operation) {
      clearStatus();
      try {
        if (pendingOperation && !waitingForOperand) {
          const right = Number(display.textContent);
          const result = await requestCalculation(firstOperand, pendingOperation, right);
          display.textContent = String(result);
          firstOperand = result;
        } else if (firstOperand === null) {
          firstOperand = Number(display.textContent);
        }
        pendingOperation = operation;
        expression.textContent = `${display.textContent} ${operationSymbol(operation)}`;
        waitingForOperand = true;
      } catch (error) {
        resetAfterError(error);
      }
    }

    function operationSymbol(operation) {
      return { add: "+", subtract: "−", multiply: "×", divide: "÷" }[operation];
    }

    async function calculateResult() {
      if (!pendingOperation || firstOperand === null || waitingForOperand) return;
      clearStatus();
      const operation = pendingOperation;
      const right = Number(display.textContent);
      expression.textContent = `${firstOperand} ${operationSymbol(operation)} ${right} =`;
      try {
        const result = await requestCalculation(firstOperand, operation, right);
        display.textContent = String(result);
        firstOperand = null;
        pendingOperation = null;
        waitingForOperand = true;
      } catch (error) {
        resetAfterError(error);
      }
    }

    function resetAfterError(error) {
      status.textContent = error.message;
      expression.textContent = "";
      firstOperand = null;
      pendingOperation = null;
      waitingForOperand = true;
    }

    function handleAction(action) {
      clearStatus();
      if (action === "clear") {
        display.textContent = "0";
        expression.textContent = "";
        firstOperand = null;
        pendingOperation = null;
        waitingForOperand = false;
      } else if (action === "sign") {
        if (display.textContent !== "0") {
          display.textContent = String(-Number(display.textContent));
        }
      } else if (action === "backspace" && !waitingForOperand) {
        display.textContent = display.textContent.length > 1
          ? display.textContent.slice(0, -1)
          : "0";
      } else if (action === "decimal") {
        enterDecimal();
      } else if (action === "equals") {
        calculateResult();
      }
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) {
        enterDigit(button.dataset.digit);
      } else if (button.dataset.operation) {
        chooseOperation(button.dataset.operation);
      } else if (button.dataset.action) {
        handleAction(button.dataset.action);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) {
        enterDigit(event.key);
      } else if (event.key === ".") {
        enterDecimal();
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculateResult();
      } else if (event.key === "Escape") {
        handleAction("clear");
      } else if (event.key === "Backspace") {
        handleAction("backspace");
      } else {
        const operations = { "+": "add", "-": "subtract", "*": "multiply", "/": "divide" };
        if (operations[event.key]) chooseOperation(operations[event.key]);
      }
    });
  </script>
</body>
</html>
